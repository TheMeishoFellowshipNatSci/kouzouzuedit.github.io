<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>無題 - 構造図エディター</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: "Segoe UI", "Meiryo", "Yu Gothic UI", sans-serif;
  background: #d9e9f6;
  color: #1b3348;
}
.hidden { display: none !important; }

#app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

#quickbar {
  background: linear-gradient(#f5fbff, #c8dfef);
  border-bottom: 1px solid #82aac7;
  padding: 2px 5px;
  display: flex;
  gap: 2px;
  min-height: 30px;
  align-items: center;
}
#quickbar .ribbon-button {
  min-height: 22px;
  padding: 2px 8px;
}

#ribbon {
  background: #c7deef;
  border-bottom: 1px solid #6c9ac0;
}
#ribbon-tabs {
  display: flex;
  background: linear-gradient(#eaf4fb, #bfd8eb);
  border-bottom: 1px solid #759fbe;
  padding-top: 2px;
}
.ribbon-tab {
  min-width: 74px;
  padding: 6px 14px;
  margin-top: 2px;
  color: #173a55;
  border: 1px solid transparent;
  border-bottom: none;
  border-top-left-radius: 4px;
  border-top-right-radius: 4px;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
}
.ribbon-tab:hover {
  background: #f7fbfe;
  border-color: #8fb3cf;
}
.ribbon-tab.active {
  background: #ffffff;
  font-weight: bold;
  border: 1px solid #769eba;
  border-bottom: 1px solid #ffffff;
}
#ribbon-pages {
  height: 103px;
  overflow-x: auto;
  overflow-y: hidden;
  background: linear-gradient(#ffffff, #f7fbfe 55%, #dceaf5);
  border-left: 1px solid #769eba;
  border-right: 1px solid #769eba;
  border-bottom: 1px solid #769eba;
}
.ribbon-page {
  display: flex;
  height: 100%;
  padding: 2px 4px;
  gap: 1px;
}
.ribbon-group {
  display: flex;
  flex-direction: column;
  border-right: 1px solid #b4cadb;
  min-width: max-content;
  padding: 0 4px;
}
.ribbon-row {
  flex: 1;
  display: flex;
  gap: 2px;
  align-items: stretch;
}
.ribbon-group-title {
  text-align: center;
  color: #526c81;
  font-size: 9pt;
  padding: 1px 8px 2px;
}
.ribbon-column {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}
.ribbon-button {
  color: #173a55;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 3px;
  padding: 3px 6px;
  min-height: 24px;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
  font-size: 12px;
}
.ribbon-button:hover {
  border: 1px solid #e5a02d;
  background: linear-gradient(#fffef5, #ffeab0 48%, #ffc85c);
}
.ribbon-button:active,
.ribbon-button.checked {
  border: 1px solid #bd7318;
  background: #ffd273;
}
.ribbon-button.large {
  min-width: 78px;
  min-height: 68px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.btn-label {
  line-height: 1.15;
}

#canvas-container {
  flex: 1;
  margin: 5px;
  background: #ffffff;
  border: 1px solid #739cba;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
#svg {
  width: 100%;
  height: 100%;
  display: block;
  background: #ffffff;
  touch-action: none;
  cursor: grab;
}
#svg:active { cursor: grabbing; }

.edge {
  stroke: #355b7a;
  stroke-width: 1.55;
}
.edge.trace {
  stroke-dasharray: 5 4;
}
.node {
  font-family: "Yu Mincho", "MS PMincho", "MS Mincho", "Noto Serif CJK JP", "Times New Roman", serif;
  font-size: 16px;
  fill: #173b5d;
  cursor: pointer;
  user-select: none;
}
.node.trace {
  fill: #153d96;
}
.terminal {
  font-family: "Yu Mincho", "MS PMincho", "MS Mincho", "Noto Serif CJK JP", "Times New Roman", serif;
  font-size: 14px;
  fill: #16643a;
  user-select: none;
}
.selection-box {
  fill: rgba(51, 153, 255, 0.14);
  stroke: #3399ff;
  stroke-width: 1;
  stroke-dasharray: 3 2;
  pointer-events: none;
}

#statusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 8px;
  color: #153951;
  background: linear-gradient(#f2f9fd, #bdd8eb);
  border-top: 1px solid #739cba;
  min-height: 28px;
}
#status-message {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#zoom-label { min-width: 42px; text-align: right; }
#zoom-slider { width: 125px; }

.menu {
  position: fixed;
  z-index: 1000;
  min-width: 190px;
  background: #ffffff;
  border: 1px solid #809db4;
  padding: 3px;
  box-shadow: 2px 2px 8px rgba(0,0,0,.22);
}
.menu-item {
  padding: 5px 24px;
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
  font-size: 13px;
}
.menu-item:hover {
  background: #d8edfc;
  border-color: #7eb4dc;
}
.menu-separator {
  height: 1px;
  background: #809db4;
  margin: 3px 0;
}

#modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 4000;
  background: rgba(0,0,0,.25);
  display: flex;
  align-items: center;
  justify-content: center;
}
#modal {
  width: min(440px, calc(100vw - 24px));
  background: #d9e9f6;
  border: 1px solid #789fbc;
  border-radius: 4px;
  box-shadow: 0 4px 18px rgba(0,0,0,.3);
  padding: 12px;
}
#modal-title {
  font-weight: bold;
  margin-bottom: 6px;
}
#modal-message {
  white-space: pre-line;
  margin-bottom: 10px;
  line-height: 1.45;
}
#modal-input {
  width: 100%;
  background: #ffffff;
  color: #19364c;
  border: 1px solid #7da5c2;
  border-radius: 2px;
  padding: 5px;
  margin-bottom: 10px;
}
#modal-buttons {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}
.modal-button {
  min-width: 70px;
  border: 1px solid #789fbc;
  border-radius: 3px;
  padding: 5px 12px;
  background: linear-gradient(#ffffff, #d9e9f5);
  color: #173a55;
  cursor: pointer;
}
.modal-button:hover {
  border-color: #df9426;
  background: linear-gradient(#fffef6, #ffd67d);
}
.modal-button.primary { font-weight: bold; }

#splash {
  position: fixed;
  inset: 0;
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #7fb2d5;
}
#splash .panel {
  width: 760px;
  max-width: calc(100vw - 24px);
  height: 430px;
  position: relative;
  border: 2px solid #4e86ac;
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(#fafdff, #d8ebf8 42%, #7fb2d5);
  box-shadow: 0 8px 30px rgba(0,0,0,.3);
}
#splash .glow {
  position: absolute;
  left: -90px;
  top: 22px;
  width: 690px;
  height: 335px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(178,220,247,.43), rgba(44,124,181,.12));
}
#splash .title {
  position: absolute;
  left: 48px;
  right: 48px;
  top: 128px;
  text-align: center;
  font-size: 44px;
  font-weight: 300;
  color: #123d5c;
  font-family: "Segoe UI Light", "Segoe UI", sans-serif;
}
#splash .subtitle {
  position: absolute;
  left: 48px;
  right: 48px;
  top: 213px;
  text-align: center;
  color: #315d79;
  font-size: 14px;
}
#splash .line {
  position: absolute;
  left: 28px;
  right: 28px;
  top: 342px;
  border-top: 1px solid rgba(255,255,255,.85);
}
#splash .copy,
#splash .version,
#splash .loading {
  position: absolute;
  left: 35px;
  right: 35px;
  text-align: center;
  color: #244b64;
}
#splash .copy { top: 360px; font-size: 12px; }
#splash .version { top: 389px; font-size: 11px; }
#splash .loading { top: 408px; font-size: 12px; text-align: left; }

#language-selector-wrap { margin-left: auto; display: flex; align-items: center; }
#language-selector {
  min-height: 22px; padding: 2px 24px 2px 7px; color: #173a55;
  background: linear-gradient(#ffffff, #d9e9f5); border: 1px solid #789fbc;
  border-radius: 3px; font: inherit; font-size: 12px; cursor: pointer;
}
#language-selector:hover, #language-selector:focus { border-color: #df9426; outline: none; }
#language-warning { display: none; margin: -4px 0 10px; padding: 6px 8px;
  color: #6b3d00; background: #fff4ce; border: 1px solid #d6a545;
  border-radius: 2px; font-size: 12px; line-height: 1.4; white-space: pre-line; }

</style>
</head>
<body>

<div id="splash">
  <div class="panel">
    <div class="glow"></div>
    <div class="title">構造図エディター</div>
    <div class="subtitle">Syntax Tree Editing Environment</div>
    <div class="line"></div>
    <div class="copy">© 2025-2026 The Meisho Fellowship. All Rights Reserved.</div>
    <div class="version">Version 1.1</div>
    <div class="loading" id="splash-loading">  設定を読み込んでいます...</div>
  </div>
</div>

<div id="app">
  <div id="quickbar"></div>

  <div id="ribbon">
    <div id="ribbon-tabs"></div>
    <div id="ribbon-pages"></div>
  </div>

  <div id="canvas-container">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <g id="content"></g>
    </svg>
  </div>

  <div id="statusbar">
    <span id="status-message">準備中...</span>
    <span id="user-label"></span>
    <span id="zoom-label">100%</span>
    <input type="range" id="zoom-slider" min="25" max="250" value="100" />
  </div>
</div>

<div id="context-menu" class="menu hidden"></div>

<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-title"></div>
    <div id="modal-message"></div>
    <input id="modal-input" type="text" />
    <div id="language-warning" role="alert"></div>
    <div id="modal-buttons"></div>
  </div>
</div>

<input type="file" id="file-input" accept=".jundai,.gktm,.json,application/json" hidden />

  "사용자":"리용자", "이용":"리용", "연결":"련결", "연락":"련락", "역사":"력사",

};

function tr(value) {
  if (value === null || value === undefined) return value;
  let s = String(value);
  const dict = I18N[currentLanguage] || I18N.ru;
  if (Object.prototype.hasOwnProperty.call(dict, s)) return dict[s];
  const replacements = Object.entries(dict).sort((a,b) => b[0].length - a[0].length);
  for (const [from, to] of replacements) s = s.split(from).join(to);
  return s;
}

function koreanWarnings(value) {
  if (currentLanguage !== "ko") return [];
  return Object.entries(SOUTH_KOREAN_TERMS).filter(([term]) => String(value).includes(term));
}

function updateLanguageWarning() {
  const warning = $("#language-warning");
  const input = $("#modal-input");
  if (!warning || !input || input.style.display === "none") return;
  const found = koreanWarnings(input.value);
  if (!found.length) { warning.style.display = "none"; warning.textContent = ""; return; }
  warning.textContent = "경고: 남조선에서 쓰이는 표현이 들어있습니다.\n" +
    found.map(([a,b]) => `${a} → ${b}`).join("\n") +
    "\n문화어표현으로 고쳐쓰는것을 권고합니다.";
  warning.style.display = "block";
}

function buildLanguageSelector() {
  const wrap = document.createElement("div");
  wrap.id = "language-selector-wrap";
  const select = document.createElement("select");
  select.id = "language-selector";
  select.setAttribute("aria-label", tr("言語"));
  select.title = tr("言語");
  for (const [code, name] of Object.entries(LANGUAGES)) {
    const option = document.createElement("option"); option.value = code; option.textContent = name;
    select.appendChild(option);
  }
  select.value = currentLanguage;
  select.addEventListener("change", () => {
    currentLanguage = select.value; localStorage.setItem("ui_language", currentLanguage);
    document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : currentLanguage;
    buildQuickAccess(); buildRibbon(); updateUserLabel(); updateTitle(); updateHeadButton(); updateSelectionStatus();
    $("#splash .title").textContent = tr("構造図エディター");
  });
  wrap.appendChild(select); return wrap;
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
  return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function deepClone(value) {
  if (typeof structuredClone === "function") return structuredClone(value);
  return JSON.parse(JSON.stringify(value));
}

function createNode(label, options = {}) {
  return {
    uid: options.uid || uuid(),
    label: String(label ?? "X"),
    trace: Boolean(options.trace),
    terminal: String(options.terminal ?? ""),
    children: []
  };
}

function nodeToDict(node) {
  return {
    uid: node.uid,
    label: node.label,
    trace: node.trace,
    terminal: node.terminal,
    children: node.children.map(nodeToDict)
  };
}

function nodeFromDict(data) {
  const node = createNode(data?.label ?? "X", {
    uid: data?.uid || uuid(),
    trace: data?.trace,
    terminal: data?.terminal ?? ""
  });
  node.children = Array.isArray(data?.children) ? data.children.map(nodeFromDict) : [];
  return node;
}

function renewUids(node) {
  node.uid = uuid();
  node.children.forEach(renewUids);
}

function buildDefaultTree(headLeftFlag = true) {
  const rootNode = createNode("C''");
  const cBar = createNode("C'");
  const c = createNode("C");
  const iDouble = createNode("I''");
  const nDouble = createNode("N''");
  const iBar = createNode("I'");

  cBar.children = headLeftFlag ? [c, iDouble] : [iDouble, c];
  iDouble.children = headLeftFlag ? [nDouble, iBar] : [iBar, nDouble];
  rootNode.children = [cBar];
  return rootNode;
}

function assignParentMap(rootNode) {
  const map = new Map();
  const stack = [rootNode];
  while (stack.length) {
    const node = stack.pop();
    for (const child of node.children) {
      map.set(child.uid, node);
      stack.push(child);
    }
  }
  return map;
}

function buildNodeByUid(rootNode) {
  const map = new Map();
  const stack = [rootNode];
  while (stack.length) {
    const node = stack.pop();
    map.set(node.uid, node);
    stack.push(...node.children);
  }
  return map;
}

function layoutTree(rootNode, hSpacing = 145, vSpacing = 110) {
  const positions = new Map();
  let nextX = 0;

  function visit(node, depth) {
    if (!node.children.length) {
      const x = nextX;
      nextX += hSpacing;
      positions.set(node.uid, [x, depth * vSpacing]);
      return x;
    }
    const xs = node.children.map((child) => visit(child, depth + 1));
    const x = xs.reduce((a, b) => a + b, 0) / xs.length;
    positions.set(node.uid, [x, depth * vSpacing]);
    return x;
  }

  visit(rootNode, 0);
  return positions;
}

function dominates(a, b, map) {
  let current = b;
  while (current) {
    if (current.uid === a.uid) return true;
    current = map.get(current.uid);
  }
  return false;
}

function firstBranchingNodeAbove(node, map) {
  let current = map.get(node.uid);
  while (current) {
    if (current.children.length >= 2) return current;
    current = map.get(current.uid);
  }
  return null;
}

function cCommands(a, b, map) {
  if (a.uid === b.uid) return false;
  if (dominates(a, b, map) || dominates(b, a, map)) return false;
  const branching = firstBranchingNodeAbove(a, map);
  return branching !== null && dominates(branching, b, map);
}

function sanitizeFilename(value) {
  value = String(value || "").trim().replace(/[\\/:*?"<>|]/g, "_");

function showModal(options) {
  return new Promise((resolve) => {
    const overlay = $("#modal-overlay");
    const titleEl = $("#modal-title");
    const messageEl = $("#modal-message");
    const inputEl = $("#modal-input");
    const buttonsEl = $("#modal-buttons");

    let finished = false;
    const cancelValue = options.cancelValue ?? null;

    titleEl.textContent = tr(options.title || "");
    messageEl.textContent = tr(options.message || "");
    messageEl.style.display = options.message ? "block" : "none";
    inputEl.style.display = options.input ? "block" : "none";
    inputEl.value = options.inputValue || "";
    inputEl.oninput = updateLanguageWarning;
    setTimeout(updateLanguageWarning, 0);
    buttonsEl.innerHTML = "";

    function cleanup() {
      document.removeEventListener("keydown", onKeydown, true);
      overlay.removeEventListener("mousedown", onOverlayMouseDown);
    }

    function finish(value) {
      if (finished) return;
      finished = true;
      cleanup();
      overlay.classList.add("hidden");
      const languageWarning = $("#language-warning"); if (languageWarning) { languageWarning.style.display = "none"; languageWarning.textContent = ""; }
      resolve({ value, text: options.input ? inputEl.value : undefined });
    }

    function onKeydown(e) {
      if (e.isComposing) return;
      if (e.key === "Enter") {
        e.preventDefault();
        e.stopPropagation();
        const primary = options.buttons.find((b) => b.primary) || options.buttons[0];
        finish(primary.value);
      } else if (e.key === "Escape" && cancelValue !== null) {
        e.preventDefault();
        e.stopPropagation();
        finish(cancelValue);
      }
    }

    function onOverlayMouseDown(e) {
      if (e.target === overlay && cancelValue !== null) finish(cancelValue);
    }

    options.buttons.forEach((b) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "modal-button" + (b.primary ? " primary" : "");
      btn.textContent = tr(b.label);
      btn.addEventListener("click", () => finish(b.value));
      buttonsEl.appendChild(btn);
    });

    document.addEventListener("keydown", onKeydown, true);
    overlay.addEventListener("mousedown", onOverlayMouseDown);
    overlay.classList.remove("hidden");

    setTimeout(() => {
      if (options.input) {
        inputEl.focus();
        inputEl.select();
      } else {
        const btn = buttonsEl.querySelector(".primary") || buttonsEl.querySelector("button");
        btn?.focus();
      }
    }, 0);
  });
}

function getSelectedNode() {

function applyTransform() {
  $("#content").setAttribute(
    "transform",
    `translate(${transform.x},${transform.y}) scale(${transform.k})`
  );
}

function updateZoomUI(percent) {
  $("#zoom-label").textContent = `${percent}%`;
  $("#zoom-slider").value = Math.max(25, Math.min(250, percent));
}

function setZoomPercent(percent) {
  const container = $("#canvas-container");
  const rect = container.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;

  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const wx = (cx - transform.x) / transform.k;
  const wy = (cy - transform.y) / transform.k;

  transform.k = Math.max(0.25, Math.min(2.5, percent / 100));
  transform.x = cx - wx * transform.k;
  transform.y = cy - wy * transform.k;

  applyTransform();
  updateZoomUI(Math.round(transform.k * 100));
}

function fitTree() {
  const container = $("#canvas-container");
  const content = $("#content");
  const rect = container.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return;

  const bbox = content.getBBox();
  if (!bbox.width && !bbox.height) return;

  const pad = 45;
  const bw = bbox.width + pad * 2;
  const bh = bbox.height + pad * 2;
  const k = Math.max(0.25, Math.min(2.5, Math.min(rect.width / bw, rect.height / bh)));

  transform.k = k;
  transform.x = (rect.width - bbox.width * k) / 2 - bbox.x * k;
  transform.y = (rect.height - bbox.height * k) / 2 - bbox.y * k;

  applyTransform();
  updateZoomUI(Math.round(k * 100));
}

function updateSelectionVisual() {
  const content = $("#content");
  content.querySelectorAll(".selection-box").forEach((r) => r.remove());

  if (!selectedUid) return;
  const textEl = content.querySelector(`.node[data-uid="${selectedUid}"]`);
  if (!textEl) return;

  const bbox = textEl.getBBox();
  const rect = document.createElementNS(SVG_NS, "rect");
  rect.setAttribute("class", "selection-box");
  rect.setAttribute("x", bbox.x - 6);
  rect.setAttribute("y", bbox.y - 4);
  rect.setAttribute("width", bbox.width + 12);
  rect.setAttribute("height", bbox.height + 8);
  content.insertBefore(rect, textEl);
}

function updateSelectionStatus() {

    const suffix = !node.children.length

      : "";
    setStatus(`選択: ${node.label}${suffix}`);
  } else {
    setStatus("未選択");
  }
}

function selectUid(uid) {
  selectedUid = uid;
  updateSelectionVisual();
  updateSelectionStatus();
}

function createSvgText(value, x, y, className) {
  const text = document.createElementNS(SVG_NS, "text");
  text.setAttribute("x", x);
  text.setAttribute("y", y);
  text.setAttribute("text-anchor", "middle");
  text.setAttribute("dominant-baseline", "middle");
  text.setAttribute("class", className);
  text.textContent = value;
  return text;
}

function refresh(fitView = false) {
  parentMap = assignParentMap(root);
  nodeByUid = buildNodeByUid(root);

  if (selectedUid && !nodeByUid.has(selectedUid)) selectedUid = null;
  if (ccommandAUid && !nodeByUid.has(ccommandAUid)) ccommandAUid = null;

  const positions = layoutTree(root);
  const content = $("#content");
  content.innerHTML = "";

  function drawEdges(node) {
    const [px, py] = positions.get(node.uid);
    for (const child of node.children) {
      const [cx, cy] = positions.get(child.uid);
      const line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("x1", px);
      line.setAttribute("y1", py + 20);
      line.setAttribute("x2", cx);
      line.setAttribute("y2", cy - 20);
      line.setAttribute("class", child.trace ? "edge trace" : "edge");
      content.appendChild(line);
      drawEdges(child);
    }
  }
  drawEdges(root);

  for (const [uid, [x, y]] of positions.entries()) {
    const node = nodeByUid.get(uid);
    const text = createSvgText(node.label, x, y, node.trace ? "node trace" : "node");
    text.setAttribute("data-uid", uid);
    content.appendChild(text);

    if (!node.children.length && node.terminal) {
      const terminalText = createSvgText(node.terminal, x, y + 32, "terminal");
      content.appendChild(terminalText);
    }
  }

  updateSelectionVisual();
  updateSelectionStatus();

  if (fitView) requestAnimationFrame(fitTree);
}

function snapshot() {
  return { root: deepClone(root), headLeft };
}

function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
  modified = true;
  updateTitle();
}

function restoreState(state, message) {
  root = state.root;
  headLeft = state.headLeft;
  selectedUid = null;
  ccommandAUid = null;
  modified = true;
  updateHeadButton();
  refresh();
  updateTitle();
  setStatus(message);
}

function undo() {
  if (!undoStack.length) {
    setStatus("これ以上元に戻せません");
    return;
  }
  redoStack.push(snapshot());
  restoreState(undoStack.pop(), "元に戻しました");
}

function redo() {
  if (!redoStack.length) {
    setStatus("これ以上やり直せません");
    return;
  }
  undoStack.push(snapshot());
  restoreState(redoStack.pop(), "やり直しました");
}

function toggleHead() {
  headLeft = !headLeft;
  modified = true;
  updateTitle();
  updateHeadButton();
  setStatus(`既定順：${headLeft ? "左" : "右"}`);
}

function documentData() {
  return {
    format: DOCUMENT_FORMAT,
    version: 1,
    application: APP_NAME,
    username,
    head_left: headLeft,
    save_number: figureNumber,
    tree: nodeToDict(root)
  };
}

function downloadBlob(filename, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function downloadTextFile(filename, text) {
  downloadBlob(filename, new Blob([text], { type: "application/json" }));
}

function pickFileInput() {
  return new Promise((resolve) => {
    const input = $("#file-input");
    input.value = "";
    const handler = () => {
      input.removeEventListener("change", handler);
      resolve(input.files && input.files[0] ? input.files[0] : null);
    };
    input.addEventListener("change", handler);
    input.click();
  });
}

async function loadFile(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || typeof data !== "object" || !("tree" in data)) {
      throw new Error("対応していないファイル形式です。");
    }

    root = nodeFromDict(data.tree);
    headLeft = Boolean(data.head_left ?? true);

    const num = parseInt(data.save_number ?? data.figure_number ?? figureNumber, 10);
    if (Number.isFinite(num)) figureNumber = num;

    currentFileName = file.name;
    modified = false;
    undoStack = [];
    redoStack = [];
    selectedUid = null;
    ccommandAUid = null;

    updateHeadButton();
    refresh(true);
    updateTitle();
    setStatus(`開きました: ${file.name}`);
  } catch (exc) {
    await alertInfo("読込エラー", String(exc?.message || exc));
  }
}

async function maybeSave() {
  if (!modified) return true;

  const res = await showModal({
    title: "未保存の変更",
    message: "変更を保存しますか？",
    buttons: [
      { label: "保存", value: "save", primary: true },
      { label: "破棄", value: "discard" },
      { label: "キャンセル", value: "cancel" }
    ],
    cancelValue: "cancel"
  });

  if (res.value === "save") return await saveDocument(false);
  if (res.value === "discard") return true;
  return false;
}

async function newTree() {
  if (!(await maybeSave())) return;

  root = buildDefaultTree(headLeft);
  currentFileName = null;
  fileHandle = null;
  modified = false;
  undoStack = [];
  redoStack = [];
  selectedUid = null;
  ccommandAUid = null;

  refresh(true);
  updateTitle();
  setStatus("新規作成しました");
}

async function openDocument() {
  if (!(await maybeSave())) return;

  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [
          {
            description: "構造図ファイル",
            accept: { "application/json": [".jundai", ".gktm", ".json"] }
          }
        ],
        multiple: false
      });
      fileHandle = handle;
      const file = await handle.getFile();
      await loadFile(file);
      return;
    } catch (err) {
      if (err?.name === "AbortError") return;
    }
  }

  const file = await pickFileInput();
  if (file) {
    fileHandle = null;
    await loadFile(file);
  }
}

async function saveDocument(as = false) {
  const text = JSON.stringify(documentData(), null, 2);

  if (!as && fileHandle && fileHandle.createWritable) {
    try {
      const writable = await fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
      currentFileName = fileHandle.name;
      modified = false;
      updateTitle();
      setStatus(`保存しました: ${currentFileName}`);
      return true;
    } catch (err) {
      console.warn("fileHandle write failed", err);
    }
  }

  const suggested = (!as && currentFileName)
    ? currentFileName
    : baseFilename() + DOCUMENT_EXTENSION;

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [
          {
            description: "構造図エディターファイル",
            accept: { "application/json": [DOCUMENT_EXTENSION] }
          }
        ]
      });
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();

      fileHandle = handle;
      currentFileName = handle.name;
      modified = false;
      updateTitle();
      setStatus(`保存しました: ${currentFileName}`);
      return true;
    } catch (err) {
      if (err?.name === "AbortError") return false;
    }
  }

  const res = await showModal({
    title: "名前を付けて保存",
    message: "ファイル名を入力してください（ダウンロード保存になります）。",
    input: true,
    inputValue: suggested,
    buttons: [
      { label: "保存", value: "ok", primary: true },
      { label: "キャンセル", value: "cancel" }
    ],
    cancelValue: "cancel"
  });

  if (res.value !== "ok") return false;

  let filename = sanitizeFilename((res.text || "").trim() || suggested);
  if (!filename.toLowerCase().endsWith(DOCUMENT_EXTENSION)) filename += DOCUMENT_EXTENSION;

  downloadTextFile(filename, text);
  fileHandle = null;
  currentFileName = filename;
  modified = false;
  updateTitle();
  setStatus(`保存しました（ダウンロード）: ${filename}`);
  return true;
}

async function swapSelectedChildren() {
  const node = getSelectedNode();
  if (!node || node.children.length < 2) {
    await alertInfo("左右交換", "子を2つ以上持つノードを選択してください。");
    return;
  }

  pushUndo();
  node.children.reverse();
  refresh();
  setStatus("子の左右を交換しました");
}

async function applySimpleRule(requiredLabel, childLabels, description) {
  const node = getSelectedNode();

  if (!node) {
    await alertInfo("ノード未選択", `先に ${requiredLabel} を選択してください。`);
    return;
  }

  if (node.label !== requiredLabel) {
    await alertInfo(
      "規則が適用できません",
      `${description} は ${requiredLabel} に適用してください。\n選択中: ${node.label}`
    );
    return;
  }

  if (node.children.length) {
    const res = await confirmYesNo("確認", `${node.label} の既存の子を置き換えますか？`);
    if (res.value !== "yes") return;
  }

  pushUndo();
  const children = childLabels.map((label) => createNode(label));
  if (!headLeft) children.reverse();
  node.children = children;

  refresh();
  setStatus(`${description} を適用しました`);
}

async function copySubtree() {
  const node = getSelectedNode();
  if (!node) {
    await alertInfo("コピー", "部分木を選択してください。");
    return;
  }

  clipboardSubtree = deepClone(node);
  setStatus("部分木をコピーしました");
}

async function cutSubtree() {
  const node = getSelectedNode();
  if (!node || node.uid === root.uid) {
    await alertInfo("切り取り", "根以外の部分木を選択してください。");
    return;
  }

  clipboardSubtree = deepClone(node);
  const parent = parentMap.get(node.uid);
  if (!parent) return;

  pushUndo();
  parent.children = parent.children.filter((child) => child.uid !== node.uid);

  if (selectedUid === node.uid) selectedUid = null;
  if (ccommandAUid === node.uid) ccommandAUid = null;

  refresh();
  setStatus("部分木を切り取りました");
}

async function pasteSubtree() {
  const parent = getSelectedNode();
  if (!parent || !clipboardSubtree) {
    await alertInfo("貼り付け", "貼り付け先とコピー済み部分木が必要です。");
    return;
  }

  pushUndo();
  const clone = deepClone(clipboardSubtree);
  renewUids(clone);
  parent.children.push(clone);

  refresh();
  setStatus("貼り付けました");
}

async function duplicateSubtree() {
  const node = getSelectedNode();
  if (!node || node.uid === root.uid) {
    await alertInfo("複製", "根以外の部分木を選択してください。");
    return;
  }

  const parent = parentMap.get(node.uid);
  if (!parent) return;

  pushUndo();
  const clone = deepClone(node);
  renewUids(clone);

  const index = parent.children.findIndex((child) => child.uid === node.uid);
  parent.children.splice(index + 1, 0, clone);

  refresh();
  setStatus("部分木を複製しました");
}

async function deleteSelectedNode(showMessages = true) {
  const node = getSelectedNode();
  if (!node || node.uid === root.uid) {
    if (showMessages) await alertInfo("枝削除", "根以外のノードを選択してください。");
    return;
  }

  const parent = parentMap.get(node.uid);
  if (!parent) return;

  pushUndo();
  parent.children = parent.children.filter((child) => child.uid !== node.uid);

  if (selectedUid === node.uid) selectedUid = null;
  if (ccommandAUid === node.uid) ccommandAUid = null;

  refresh();
  setStatus("枝削除しました");
}

async function clearChildren() {
  const node = getSelectedNode();
  if (!node || !node.children.length) {
    await alertInfo("子削除", "子を持つノードを選択してください。");

}

async function saveImage() {
  const content = $("#content");

  content.querySelectorAll(".selection-box").forEach((r) => r.remove());
  const bbox = content.getBBox();
  updateSelectionVisual();

  const view = {
    x: bbox.x - 35,
    y: bbox.y - 35,
    width: bbox.width + 70,
    height: bbox.height + 70
  };

  if (view.width < 20 || view.height < 20) {
    await alertInfo("保存", "描画領域が小さすぎます。");
    return;
  }

  const svg = $("#svg");
  const clone = svg.cloneNode(true);
  clone.setAttribute("xmlns", SVG_NS);
  clone.setAttribute("width", String(view.width));
  clone.setAttribute("height", String(view.height));
  clone.setAttribute("viewBox", `${view.x} ${view.y} ${view.width} ${view.height}`);

  const cloneContent = clone.querySelector("#content");
  if (cloneContent) {
    cloneContent.removeAttribute("transform");
    cloneContent.querySelectorAll(".selection-box").forEach((r) => r.remove());
  }

  const white = document.createElementNS(SVG_NS, "rect");
  white.setAttribute("x", view.x);
  white.setAttribute("y", view.y);
  white.setAttribute("width", view.width);
  white.setAttribute("height", view.height);
  white.setAttribute("fill", "#ffffff");
  clone.insertBefore(white, clone.firstChild);

  clone.querySelectorAll("line.edge").forEach((line) => {
    line.setAttribute("stroke", "#355b7a");
    line.setAttribute("stroke-width", "1.55");
    if (line.classList.contains("trace")) line.setAttribute("stroke-dasharray", "5,4");
  });

  clone.querySelectorAll("text.node").forEach((text) => {
    text.setAttribute("font-family", FONT_STACK);
    text.setAttribute("font-size", "16");
    text.setAttribute("fill", text.classList.contains("trace") ? "#153d96" : "#173b5d");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
  });

  clone.querySelectorAll("text.terminal").forEach((text) => {
    text.setAttribute("font-family", FONT_STACK);
    text.setAttribute("font-size", "14");
    text.setAttribute("fill", "#16643a");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
  });

  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);

  try {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error("SVGの描画に失敗しました。"));
      img.src = url;
    });

    const scale = EXPORT_SCALE;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(view.width * scale));
    canvas.height = Math.max(1, Math.round(view.height * scale));

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
    if (!blob) throw new Error("PNGの生成に失敗しました。");

    const suggested = baseFilename() + ".png";

    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: suggested,
          types: [
            { description: "PNG画像", accept: { "image/png": [".png"] } }
          ]
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();

        figureNumber++;
        localStorage.setItem("save_number", String(figureNumber));
        setStatus(`高画質PNGを保存しました: ${handle.name}`);
        return;
      } catch (err) {
        if (err?.name === "AbortError") return;
      }
    }

    downloadBlob(suggested, blob);
    figureNumber++;
    localStorage.setItem("save_number", String(figureNumber));
    setStatus(`高画質PNGを保存しました: ${suggested}`);
  } catch (err) {
    await alertInfo("エラー", String(err?.message || err));
  } finally {
    URL.revokeObjectURL(url);
  }
}

function createActionButton(actionId, large = false) {
  const action = actions[actionId];
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "ribbon-button" + (large ? " large" : "");
  btn.dataset.action = actionId;

  const span = document.createElement("span");
  span.className = "btn-label";
  span.textContent = tr(action.label);
  btn.appendChild(span);

  btn.title = tr(`${action.tooltip || action.label}`);
  btn.addEventListener("click", async () => {
    hideContextMenu();
    await action.run();
  });

  return btn;
}

function createCustomButton(label, onClick, large = false, tooltip = null) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "ribbon-button" + (large ? " large" : "");

  const span = document.createElement("span");
  span.className = "btn-label";
  span.textContent = tr(label);
  btn.appendChild(span);

  if (tooltip) btn.title = tr(tooltip);
  btn.addEventListener("click", async () => {
    hideContextMenu();
    await onClick();
  });

  return btn;
}

function createGroup(title, build) {
  const group = document.createElement("div");
  group.className = "ribbon-group";

  const row = document.createElement("div");
  row.className = "ribbon-row";

  const titleEl = document.createElement("div");
  titleEl.className = "ribbon-group-title";
  titleEl.textContent = tr(title);

  if (build) build(row);

  group.appendChild(row);
  group.appendChild(titleEl);
  return group;
}

function addColumn(row, elements) {
  const col = document.createElement("div");
  col.className = "ribbon-column";
  elements.forEach((el) => col.appendChild(el));
  row.appendChild(col);
}

function addActionColumn(row, ids) {
  addColumn(row, ids.map((id) => createActionButton(id, false)));
}

function addLargeAction(row, id) {
  row.appendChild(createActionButton(id, true));
}

function buildHomePage(page) {
  page.appendChild(createGroup("ファイル", (row) => {
    addLargeAction(row, "new");
    addActionColumn(row, ["open", "save", "export"]);
  }));

  page.appendChild(createGroup("履歴", (row) => {
    addActionColumn(row, ["undo", "redo"]);
  }));

  page.appendChild(createGroup("クリップボード", (row) => {
    addLargeAction(row, "paste");
    addActionColumn(row, ["copy", "cut", "duplicate"]);
  }));

  page.appendChild(createGroup("編集", (row) => {
    addLargeAction(row, "label");
    addActionColumn(row, ["terminal", "delete", "clear"]);
  }));

  page.appendChild(createGroup("設定", (row) => {
    addActionColumn(row, ["swap", "head", "username"]);
  }));
}

function selectRibbonTab(index) {
  const tabs = $("#ribbon-tabs");
  const pages = $("#ribbon-pages");

  Array.from(tabs.children).forEach((tab, i) => {
    tab.classList.toggle("active", i === index);
  });

  Array.from(pages.children).forEach((page, i) => {
    page.classList.toggle("hidden", i !== index);
  });
}

function buildRibbon() {
  const tabs = [
    { title: "ホーム", builder: buildHomePage },
    { title: "挿入", builder: buildInsertPage },
    { title: "句構造規則", builder: buildRulesPage },
    { title: "理論ツール", builder: buildTheoryPage },
    { title: "表示", builder: buildDisplayPage },
    { title: "使い方", builder: buildHelpPage }
  ];

  const tabsEl = $("#ribbon-tabs");
  const pagesEl = $("#ribbon-pages");

  tabsEl.innerHTML = "";
  pagesEl.innerHTML = "";

  tabs.forEach((tab, index) => {
    const tabBtn = document.createElement("button");
    tabBtn.type = "button";
    tabBtn.className = "ribbon-tab";
    tabBtn.textContent = tr(tab.title);
    tabBtn.addEventListener("click", () => selectRibbonTab(index));

    const pageEl = document.createElement("div");
    pageEl.className = "ribbon-page hidden";
    tab.builder(pageEl);

    tabsEl.appendChild(tabBtn);
    pagesEl.appendChild(pageEl);
  });

  selectRibbonTab(0);
}

function buildQuickAccess() {
  const bar = $("#quickbar");
  bar.innerHTML = "";
  ["save", "undo", "redo"].forEach((id) => {
    bar.appendChild(createActionButton(id, false));
  });
  bar.appendChild(buildLanguageSelector());
}

function hideContextMenu() {
  $("#context-menu").classList.add("hidden");
}

function showMenuAt(x, y, buildItems) {
  const menu = $("#context-menu");
  menu.innerHTML = "";
  buildItems(menu);

  menu.style.visibility = "hidden";
  menu.classList.remove("hidden");

  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  menu.style.left = Math.max(4, Math.min(x, window.innerWidth - mw - 4)) + "px";
  menu.style.top = Math.max(4, Math.min(y, window.innerHeight - mh - 4)) + "px";
  menu.style.visibility = "visible";
}

function showNodeContextMenu(x, y) {
  showMenuAt(x, y, (menu) => {
    const items = [
      "label",
      "terminal",
      "separator",
      "copy",
      "cut",
      "paste",
      "duplicate",
      "separator",
      "swap",
      "delete",
      "clear"
    ];

    items.forEach((id) => {
      if (id === "separator") {
        const sep = document.createElement("div");
        sep.className = "menu-separator";
        menu.appendChild(sep);
        return;
      }

      const item = document.createElement("div");
      item.className = "menu-item";
      item.textContent = tr(actions[id].label);
      item.addEventListener("click", async () => {
        hideContextMenu();
        await actions[id].run();
      });
      menu.appendChild(item);
    });
  });
}

function setupCanvasEvents() {
  const svg = $("#svg");
  let panState = null;
  let panMoved = false;

  svg.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 && e.button !== 1) return;

    const nodeEl = e.target.closest?.(".node");
    if (nodeEl) selectUid(nodeEl.getAttribute("data-uid"));

    panState = {
      id: e.pointerId,
      startX: e.clientX,
      startY: e.clientY,
      tx: transform.x,
      ty: transform.y,
      startedOnNode: Boolean(nodeEl)
    };
    panMoved = false;

    try {
      svg.setPointerCapture(e.pointerId);
    } catch (_) {}
  });

  svg.addEventListener("pointermove", (e) => {
    if (!panState || e.pointerId !== panState.id) return;

    const dx = e.clientX - panState.startX;
    const dy = e.clientY - panState.startY;

    if (!panMoved && Math.hypot(dx, dy) > 3) panMoved = true;

    if (panMoved) {
      transform.x = panState.tx + dx;
      transform.y = panState.ty + dy;
      applyTransform();
      hideContextMenu();
    }
  });

  svg.addEventListener("pointerup", (e) => {
    if (!panState || e.pointerId !== panState.id) return;

    if (!panMoved && !panState.startedOnNode) {
      selectedUid = null;
      updateSelectionVisual();
      updateSelectionStatus();
    }

    panState = null;
  });

  svg.addEventListener("pointercancel", () => {
    panState = null;
  });

  svg.addEventListener("dblclick", async (e) => {
    const nodeEl = e.target.closest?.(".node");
    if (nodeEl) {
      e.preventDefault();
      await editNodeByUid(nodeEl.getAttribute("data-uid"));
    }
  });

  svg.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const nodeEl = e.target.closest?.(".node");
    if (nodeEl) {
      selectUid(nodeEl.getAttribute("data-uid"));
      showNodeContextMenu(e.clientX, e.clientY);
    } else {
      hideContextMenu();
    }
  });

  svg.addEventListener("wheel", (e) => {
    e.preventDefault();

    if (e.ctrlKey) {
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      const rect = svg.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      const wx = (mx - transform.x) / transform.k;
      const wy = (my - transform.y) / transform.k;

      const newK = Math.max(0.25, Math.min(2.5, transform.k * factor));
      transform.x = mx - wx * newK;
      transform.y = my - wy * newK;
      transform.k = newK;

      applyTransform();
      updateZoomUI(Math.round(transform.k * 100));
    } else {
      transform.x -= e.deltaX;
      transform.y -= e.deltaY;
      applyTransform();
    }
  }, { passive: false });
}

function setupStatusBar() {
  const slider = $("#zoom-slider");
  slider.addEventListener("input", () => {
    setZoomPercent(parseInt(slider.value, 10) || 100);
  });
}

async function init() {
  document.documentElement.lang = currentLanguage === "zh" ? "zh-CN" : currentLanguage;
  $("#splash .title").textContent = tr("構造図エディター");
  $("#splash-loading").textContent = "  " + tr("設定を読み込んでいます...");

  root = buildDefaultTree(headLeft);

  buildQuickAccess();
  buildRibbon();
  setupCanvasEvents();
  setupStatusBar();

  refresh(false);
  updateTitle();
  updateHeadButton();

  if (!username) {
    $("#splash-loading").textContent = "  " + tr("ユーザー名を入力してください...");
    username = await requestUsernameRequired();
  }

  $("#splash-loading").textContent = currentLanguage === "ru" ? `  Подготовка среды пользователя ${username}...` : currentLanguage === "zh" ? `  正在准备 ${username} 的环境...` : currentLanguage === "ko" ? `  ${username}의 환경을 준비하고있습니다...` : `  ${username} környezetének előkészítése...`;
  updateUserLabel();
  updateTitle();

  requestAnimationFrame(() => {
    refresh(true);
  });

  setTimeout(() => {
    $("#splash").classList.add("hidden");
    requestAnimationFrame(fitTree);
  }, 1400);

  setStatus("準備完了。マウスホイールで拡大縮小、ドラッグでキャンバス移動。");
}

window.addEventListener("beforeunload", (e) => {
  if (modified) {
    e.preventDefault();
    e.returnValue = "";
  }
});

document.addEventListener("click", (e) => {
  if (!e.target.closest("#context-menu")) hideContextMenu();
});

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}
